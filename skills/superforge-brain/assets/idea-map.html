  renderLanes();

  // ---- banned ----

        h("div", { class: "row" }, h("span", { class: "badge", text: b.id }), r.win_path ? h("span", { class: "badge solid", text: r.win_path }) : h("span", { class: "badge strike", text: "w:delta w:geo w:timing w:exec" })),
        h("div", { class: "name", text: b.idea }),

        r.card_id ? h("div", { class: "meta", text: "→ " + r.card_id + " として審判へ" }) : h("div", { class: "meta", text: "禁止のまま（理由あり）" })));
    });
  })();

  // ---- maps ----
  function scatter(opts) {
    var W = 640, H = 440, pad = 44;
    var svg = s("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": opts.title });
    function X(v) { return pad + (v - opts.xmin) / (opts.xmax - opts.xmin) * (W - pad * 2); }

    [[pad + 10, pad + 20, "start"], [W - pad - 10, pad + 20, "end"], [pad + 10, H - pad - 22, "start"], [W - pad - 10, H - pad - 22, "end"]].forEach(function (p, i) {
      svg.appendChild(s("text", { x: p[0], y: p[1], "text-anchor": p[2], class: "q-label", opacity: opts.dimQuad === i ? 0.5 : 1 }, ql[i][0]));
      svg.appendChild(s("text", { x: p[0], y: p[1] + 14, "text-anchor": p[2], class: "q-sub" }, ql[i][1]));

    svg.appendChild(s("text", { x: 14, y: H / 2, "text-anchor": "middle", class: "q-sub", transform: "rotate(-90 14 " + H / 2 + ")" }, opts.ylabel));

      svg.appendChild(shape);
      svg.appendChild(s("text", { x: cx + 9, y: cy + 3, class: "pt-label" }, c.name.length > 12 ? c.name.slice(0, 12) + "…" : c.name));
    });
    var box = h("div", { class: "mapbox" }, h("h3", { text: opts.title }), opts.note ? h("p", { class: "lead", style: "font-size:13px;margin:4px 0 8px", text: opts.note }) : null);
    box.appendChild(svg);
    box.appendChild(h("div", { class: "legend" }, h("span", { text: "● スイープ" }), h("span", { text: "■ 再訪した禁止案" }), h("span", { text: "▲ Push rung" }), h("span", { text: "◆ 掛け合わせ" }), h("span", { text: "○ open world" })));
    if (unscored.length) box.appendChild(h("div", { class: "tray-inline", text: "未配置（数値なし）: " + unscored.map(function (c) { return c.id; }).join(", ") }));
    return box;
  }
  (function () {
    var maps = document.getElementById("maps");
    var judged = L.cards.filter(function (c) { return c.scores; });
    maps.appendChild(scatter({
      title: "独創軸 × 事業軸 — 4象限", xlabel: "事業軸 = User + Company →", ylabel: "独創軸 = Novelty + Wow →",
      xmin: 2, xmax: 20, ymin: 2, ymax: 20, xmid: 11.5, ymid: 11.5, points: judged,
      x: viab, y: orig, dimQuad: 2, fills: [0.05, 0.1, 0.0, 0.07],
      quads: [["Lab", "思考実験 · 戻る条件付きで棚へ"], ["Hero", "本命"], ["Discard", "唯一の正当な廃棄"], ["Workhorse", "定番 · 勝ち筋で勝つ"]],
      hover: function (c) { var q = quadrant(c); var cell = cellsById[c.id]; return q === "Lab" ? (c.lab_reentry || "⚠ 戻る条件なし") : q === "Workhorse" ? ((cell && cell.win_path) || (c.source === "revisited" ? "revisited" : "勝ち筋コードなし")) : q; }
    }));
    var hw = L.cards.filter(function (c) { var q = quadrant(c); return q === "Hero" || q === "Workhorse"; });
    maps.appendChild(scatter({
      title: "Impact × Effort（Hero と Workhorse）", xlabel: "Effort（1=半日 … 5=1年）→", ylabel: "Impact = 事業軸 →",
      note: "Effort は各カードの次の実験とリスクからの見積もりで、計測値ではありません。",
      xmin: 1, xmax: 5, ymin: 2, ymax: 20, xmid: 3, ymid: 11.5, points: hw,
      x: function (c) { return c.effort; }, y: viab, dimQuad: 3, fills: [0.1, 0.05, 0.03, 0.0],
      quads: [["Low-hanging fruit", "まずこれ"], ["Major bets", "計画して挑む"], ["Fill-ins", "時間があれば"], ["Thankless", "理由が無ければ切る"]]
    }));
    maps.appendChild(scatter({
      title: "User Impact × Company Impact（事業軸の内訳）", xlabel: "Company Impact →", ylabel: "User Impact →",
      xmin: 1, xmax: 10, ymin: 1, ymax: 10, xmid: 5.5, ymid: 5.5, points: judged,
      x: function (c) { return c.scores.company; }, y: function (c) { return c.scores.user; }, dimQuad: 2, fills: [0.05, 0.1, 0.0, 0.05],
      quads: [["User only", "収益化の仕方を変える"], ["Both", "最も強い"], ["Neither", ""], ["Company only", "ユーザーの犠牲に注意"]]
    }));
  })();

  // ---- board ----
  var F = { status: "all", tech: "all", kill: "all", quad: "all", win: "all" };
  function sel(key, label, options) {
    return h("select", { "aria-label": label, onchange: function () { F[key] = this.value; renderBoard(); } },
      options.map(function (o) { return h("option", { value: o[0], text: o[1] }); }));
  }
  document.getElementById("filters").append(
    sel("status", "Status", [["all", "全ステータス"], ["alive", "生存以上"], ["killed", "殺したもの"], ["todo", "未完了"]]),
    sel("tech", "Technique", [["all", "全技法"]].concat(TECHS.map(function (t) { return [t, TECH_JA[t] + " " + t]; }))),
    sel("kill", "Kill code", [["all", "全 kill code"], ["G", "G 汎用"], ["P", "P 物理矛盾"], ["C", "C 勝ち筋なし"]]),
    sel("quad", "Quadrant", [["all", "全象限"], ["Hero", "Hero"], ["Workhorse", "Workhorse"], ["Lab", "Lab"], ["Discard", "Discard"]]),
    sel("win", "Win path", [["all", "全勝ち筋"], ["w:delta", "w:delta"], ["w:geo", "w:geo"], ["w:timing", "w:timing"], ["w:exec", "w:exec"]])
  );
  function boardCard(cell) {
    var card = cardsById[cell.id];
    var killed = cell.status.indexOf("killed") === 0;
    var el = elementsById[cell.element_id] || {};
    var trace = h("ul", { class: "trace" },
      h("li", null, h("b", { text: "要素 " }), (el.name || cell.element_id) + " — 「" + (el.bias || "") + "」"),
      h("li", null, h("b", { text: "技法 " }), TECH_JA[cell.technique] + " / " + cell.sub_method),
      h("li", null, h("b", { text: "壊す思い込み " }), cell.bias || "—"),
      h("li", null, h("b", { text: "ありえない形 " }), cell.form || "—"),
      h("li", null, h("b", { text: "逆算 " }), "提供側: " + (cell.provider || "—") + " / ユーザー側: " + (cell.user || "—")),
      cell.prior_art ? h("li", null, h("b", { text: "既出 " }), cell.win_path ? cell.win_path + " — " + cell.win_reason : "4方向とも勝ち筋なし") : null,
      killed ? h("li", null, h("b", { text: "kill " }), cell.kill_code + " — " + (cell.kill_reason || "")) : null,
      cell.salvaged ? h("li", null, h("b", { text: "救済 " }), "誤殺として生存に戻した") : null,
      cell.merged_into ? h("li", null, h("b", { text: "統合 " }), cell.merged_into + " に吸収") : null);
    var badges = [h("span", { class: "badge", text: cell.id })];
    if (cell.status === "todo") badges.push(h("span", { class: "badge solid", text: "todo" }));
    if (killed) badges.push(h("span", { class: "badge solid", text: cell.kill_code }));
    if (cell.prior_art) badges.push(h("span", { class: "badge dashed", text: "既出" }));
    if (cell.prior_art && cell.win_path) badges.push(h("span", { class: "badge", text: cell.win_path }));
    if (cell.kill_code === "C") badges.push(h("span", { class: "badge strike", text: "w:delta w:geo w:timing w:exec" }));
    if (cell.salvaged) badges.push(h("span", { class: "badge", text: "salvaged" }));
    if (cell.recycled) badges.push(h("span", { class: "badge", text: "recycled" }));
    if (card) badges.push(h("span", { class: "badge", text: quadrant(card) || "unscored" }));
    return h("article", { class: "card" + (killed ? " killed" : "") + (cell.status === "todo" ? " dim" : "") + (card && quadrant(card) === "Discard" ? " dim" : ""), id: "board-" + cell.id },
      h("div", { class: "row" }, badges),
      h("div", { class: "name", text: (card && card.name) || cell.concept || "（未生成）" }),
      killed ? h("div", { class: "meta", text: cell.kill_code + " — " + (cell.kill_reason || "") }) : null,
      card ? h("div", { class: "row" }, scoreLine(card)) : null,
      h("details", null, h("summary", { text: "過程を見る" }), trace),
      cell.status === "todo" ? null : actions(cell.id));
  }
  function passes(cell) {
    var card = cardsById[cell.id], killed = cell.status.indexOf("killed") === 0;
    if (F.status === "alive" && (killed || cell.status === "todo")) return false;
    if (F.status === "killed" && !killed) return false;
    if (F.status === "todo" && cell.status !== "todo") return false;
    if (F.tech !== "all" && cell.technique !== F.tech) return false;
    if (F.kill !== "all" && cell.kill_code !== F.kill) return false;
    if (F.quad !== "all" && (!card || quadrant(card) !== F.quad)) return false;
    if (F.win !== "all" && cell.win_path !== F.win) return false;
    return true;
  }
  function renderBoard() {
    var box = document.getElementById("board"); box.textContent = "";
    TECHS.forEach(function (t) {
      var all = L.cells.filter(function (c) { return c.technique === t; });
      if (!all.length) return;
      var shown = all.filter(passes);
      if (!shown.length) return;
      var g = h("div", { class: "grid-cards" }); shown.forEach(function (c) { g.appendChild(boardCard(c)); });
      box.appendChild(h("div", { class: "tech" }, h("div", { class: "tech-head" }, h("h3", { text: TECH_JA[t] + " · " + t }), h("span", { class: "tag", text: shown.length + " / " + all.length })), g));
    });
    var extra = L.cards.filter(function (c) { return !cellsById[c.id] && c.source !== "revisited"; });
    if (extra.length && F.status !== "killed" && F.status !== "todo" && F.tech === "all" && F.kill === "all" && F.win === "all") {
      var g2 = h("div", { class: "grid-cards" });
      extra.filter(function (c) { return F.quad === "all" || quadrant(c) === F.quad; }).forEach(function (c) { var x = shortCard(c); x.id = "board-" + c.id; g2.appendChild(x); });
      box.appendChild(h("div", { class: "tech" }, h("div", { class: "tech-head" }, h("h3", { text: "Push ladder と掛け合わせ" }), h("span", { class: "tag", text: extra.length + " cards" })), g2));
    }
    // re-sync checkboxes
    document.querySelectorAll("[data-pick]").forEach(function (x) { x.checked = picks.hasOwnProperty(x.getAttribute("data-pick")); });
  }
  renderBoard();

  // ---- shelves ----
  (function () {
    var box = document.getElementById("shelves");
    function col(title, q, fields) {
      var list = L.cards.filter(function (c) { return quadrant(c) === q; });
      var c = h("div", { class: "lane" }, h("div", { class: "lane-head" }, h("h3", { text: title }), h("span", { class: "tag", text: list.length + " 件" })));
      list.forEach(function (x) {
        var dl = h("dl", { class: "kv" });
        fields(x).forEach(function (f) { if (f[1]) { dl.appendChild(h("dt", { text: f[0] })); dl.appendChild(h("dd", { text: f[1] })); } });
        c.appendChild(h("article", { class: "card" }, h("div", { class: "row" }, h("a", { href: "#board-" + x.id, class: "badge", text: x.id }), sourceBadges(x)), h("div", { class: "name", text: x.name }), dl));
      });
      if (!list.length) c.appendChild(h("div", { class: "slot-empty", text: "該当なし" }));
      box.appendChild(c);
    }
    col("Hero — 本命", "Hero", function (x) { return [["一行", x.one_line], ["場面", x.scene], ["なぜ驚きか", x.why_surprising], ["ユーザー価値", x.user_value], ["事業価値", x.business_value], ["価格", x.price], ["リスク", x.risks], ["次の実験", x.next_experiment]]; });
    col("Workhorse — 定番", "Workhorse", function (x) { var cell = cellsById[x.id]; var b = L.banned.filter(function (y) { return y.card_id === x.id; })[0]; return [["勝ち筋", cell && cell.win_path ? cell.win_path + " — " + cell.win_reason : b ? b.revisit.win_path + " — " + b.revisit.reason : "⚠ 勝ち筋コードなし"], ["変える一点", x.one_line], ["場面", x.scene], ["次の実験", x.next_experiment]]; });
    col("Lab — 棚", "Lab", function (x) { return [["独創軸", String(orig(x))], ["戻る条件", x.lab_reentry || "⚠ 戻る条件なし"], ["今はなぜ無理か", x.impossible_today]]; });
  })();

  renderTray();
})();
</script>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Start one phase. Keep feedback light.</title>
  <desc id="desc">Superforge is invoked once at a phase boundary, chooses the smallest useful route, then accepts ordinary follow-up feedback.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6ee7b7"/></marker></defs>

  <style>
    .bg { fill:#0b1020; }
    .panel { fill:#141b31; stroke:#334166; stroke-width:1.5; }
    .soft { fill:#10172a; stroke:#293657; stroke-width:1.2; }
    .accent { fill:#6ee7b7; }
    .blue { fill:#7dd3fc; }
    .violet { fill:#c4b5fd; }
    .amber { fill:#fcd34d; }
    .white { fill:#f8fafc; }
    .muted { fill:#a8b2cc; }
    .label { font:700 17px Inter,ui-sans-serif,system-ui,sans-serif; letter-spacing:.2px; }
    .body { font:500 15px Inter,ui-sans-serif,system-ui,sans-serif; }
    .small { font:500 13px Inter,ui-sans-serif,system-ui,sans-serif; }
    .title { font:800 34px Inter,ui-sans-serif,system-ui,sans-serif; letter-spacing:-.5px; }
    .arrow { stroke:#6ee7b7; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
  </style>
  <rect class="bg" width="1200" height="720" rx="28"/>
  <text x="70" y="70" class="title white" text-anchor="start">Start one phase. Keep feedback light.</text>
  <rect class="panel" x="70" y="112" width="300" height="94" rx="18"/>
  <text x="92" y="148" class="label white" text-anchor="start">Describe the outcome</text>
  <text x="92" y="178" class="small muted" text-anchor="start">No specialist name required</text>
  <path class="arrow" d="M380 159 H470"/>
  <rect x="480" y="112" width="650" height="94" rx="18" fill="#16342f" stroke="#3fa98a" stroke-width="1.5"/>
  <text x="505" y="148" class="label accent" text-anchor="start">Thin Router</text>
  <text x="505" y="178" class="body white" text-anchor="start">Classify size · choose one primary route</text>
  <rect x="70" y="258" width="330" height="138" rx="18" fill="#1b3349" stroke="#4896c7" stroke-width="1.5"/>
  <text x="92" y="294" class="label blue" text-anchor="start">Small</text>
  <text x="92" y="328" class="body white" text-anchor="start">One issue · 1–3 files</text>
  <text x="92" y="366" class="small muted" text-anchor="start">Handle inline</text>
  <path class="arrow" d="M805 216 C805 235 235 232 235 248"/>
  <rect x="430" y="258" width="330" height="138" rx="18" fill="#2d2850" stroke="#7c6ed0" stroke-width="1.5"/>
  <text x="452" y="294" class="label violet" text-anchor="start">Medium</text>
  <text x="452" y="328" class="body white" text-anchor="start">One coordinated change</text>
  <text x="452" y="366" class="small muted" text-anchor="start">One primary specialist</text>
  <path class="arrow" d="M805 216 C805 235 595 232 595 248"/>
  <rect x="790" y="258" width="330" height="138" rx="18" fill="#493719" stroke="#b78a32" stroke-width="1.5"/>
  <text x="812" y="294" class="label amber" text-anchor="start">Large</text>
  <text x="812" y="328" class="body white" text-anchor="start">Feature · review · release</text>
  <text x="812" y="366" class="small muted" text-anchor="start">Sequence only what is needed</text>
  <path class="arrow" d="M805 216 C805 235 955 232 955 248"/>
  <rect class="panel" x="70" y="438" width="1060" height="66" rx="16"/>
  <text x="600" y="480" class="label white" text-anchor="middle">Think  →  Build  →  Prove  →  Ship</text>
  <path class="arrow" d="M600 508 V538"/>
  <rect class="soft" x="70" y="548" width="730" height="104" rx="18"/>
  <text x="94" y="584" class="label accent" text-anchor="start">Keep the same phase</text>
  <text x="94" y="616" class="body white" text-anchor="start">Continue in ordinary language — do not invoke the router again</text>
  <text x="830" y="578" class="small muted" text-anchor="start">Optional shortcuts</text>
  <rect class="panel" x="830" y="594" width="88" height="42" rx="12"/>
  <text x="874" y="621" class="small white" text-anchor="middle">quick</text>
  <rect class="panel" x="930" y="594" width="88" height="42" rx="12"/>
  <text x="974" y="621" class="small white" text-anchor="middle">build</text>
  <rect class="panel" x="1030" y="594" width="88" height="42" rx="12"/>
  <text x="1074" y="621" class="small white" text-anchor="middle">ship</text>
</svg>

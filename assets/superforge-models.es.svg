<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Carga solo lo que necesita esta fase</title>
  <desc id="desc">Los metadatos siempre son pequeños, el router se carga una vez por fase y el contexto especialista es condicional.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6ee7b7"/></marker></defs>

  <style>
    .bg { fill:#0b1020; }
    .panel { fill:#141b31; stroke:#334166; stroke-width:1.5; }
    .soft { fill:#10172a; stroke:#293657; stroke-width:1.2; }
    .accent { fill:#6ee7b7; }
    .blue { fill:#7dd3fc; }
    .violet { fill:#c4b5fd; }
    .amber { fill:#fcd34d; }
    .white { fill:#f8fafc; }
    .muted { fill:#a8b2cc; }
    .label { font:700 17px Inter,ui-sans-serif,system-ui,sans-serif; letter-spacing:.2px; }
    .body { font:500 15px Inter,ui-sans-serif,system-ui,sans-serif; }
    .small { font:500 13px Inter,ui-sans-serif,system-ui,sans-serif; }
    .title { font:800 34px Inter,ui-sans-serif,system-ui,sans-serif; letter-spacing:-.5px; }
    .arrow { stroke:#6ee7b7; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
  </style>
  <rect class="bg" width="1200" height="720" rx="28"/>
  <text x="70" y="70" class="title white" text-anchor="start">Carga solo lo que necesita esta fase</text>
  <rect x="70" y="118" width="244" height="282" rx="18" fill="#142b3b" stroke="#4386aa" stroke-width="1.5"/>
  <text x="90" y="156" class="label blue" text-anchor="start">01</text>
  <text x="90" y="196" class="label white" text-anchor="start">Siempre visible</text>
  <text x="90" y="254" class="body blue" text-anchor="start">Metadatos breves</text>
  <text x="90" y="326" class="small muted" text-anchor="start">Lo necesario para decidir si</text>
  <text x="90" y="348" class="small muted" text-anchor="start">una skill es relevante</text>
  <path class="arrow" d="M317 259 H333"/>
  <rect x="340" y="118" width="244" height="282" rx="18" fill="#16342f" stroke="#3fa98a" stroke-width="1.5"/>
  <text x="360" y="156" class="label accent" text-anchor="start">02</text>
  <text x="360" y="196" class="label white" text-anchor="start">Al empezar una fase</text>
  <text x="360" y="254" class="body accent" text-anchor="start">Router de 99 líneas · 713</text>
  <text x="360" y="277" class="body accent" text-anchor="start">palabras</text>
  <text x="360" y="326" class="small muted" text-anchor="start">Se lee una vez y se reutiliza</text>
  <text x="360" y="348" class="small muted" text-anchor="start">la ruta activa</text>
  <path class="arrow" d="M587 259 H603"/>
  <rect x="610" y="118" width="244" height="282" rx="18" fill="#2b2650" stroke="#7767ca" stroke-width="1.5"/>
  <text x="630" y="156" class="label violet" text-anchor="start">03</text>
  <text x="630" y="196" class="label white" text-anchor="start">Cuando hace falta</text>
  <text x="630" y="220" class="label white" text-anchor="start">experiencia</text>
  <text x="630" y="254" class="body violet" text-anchor="start">Una especialidad principal</text>
  <text x="630" y="326" class="small muted" text-anchor="start">Otra solo ante una dependencia</text>
  <text x="630" y="348" class="small muted" text-anchor="start">real</text>
  <path class="arrow" d="M857 259 H873"/>
  <rect x="880" y="118" width="244" height="282" rx="18" fill="#463719" stroke="#a77d2d" stroke-width="1.5"/>
  <text x="900" y="156" class="label amber" text-anchor="start">04</text>
  <text x="900" y="196" class="label white" text-anchor="start">Antes de terminar o</text>
  <text x="900" y="220" class="label white" text-anchor="start">publicar</text>
  <text x="900" y="254" class="body amber" text-anchor="start">Pruebas y después puerta de</text>
  <text x="900" y="277" class="body amber" text-anchor="start">publicación</text>
  <text x="900" y="326" class="small muted" text-anchor="start">Verificar y publicar son</text>
  <text x="900" y="348" class="small muted" text-anchor="start">decisiones distintas</text>
  <rect class="panel" x="70" y="444" width="1060" height="82" rx="18"/>
  <text x="92" y="478" class="body white" text-anchor="start">Estado duradero solo si debe sobrevivir a la conversación</text>
  <text x="92" y="510" class="body muted" text-anchor="start">Registro solo para corrección · fallo · publicación</text>
  <text x="70" y="584" class="small muted" text-anchor="start">Atajos opcionales</text>
  <rect class="soft" x="70" y="602" width="112" height="48" rx="13"/>
  <text x="126" y="632" class="body white" text-anchor="middle">quick</text>
  <rect class="soft" x="196" y="602" width="112" height="48" rx="13"/>
  <text x="252" y="632" class="body white" text-anchor="middle">build</text>
  <rect class="soft" x="322" y="602" width="112" height="48" rx="13"/>
  <text x="378" y="632" class="body white" text-anchor="middle">ship</text>
  <text x="1118" y="632" class="small muted" text-anchor="end">metadata → router → specialist → evidence</text>
</svg>

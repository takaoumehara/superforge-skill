<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">只加载当前阶段需要的信息</title>
  <desc id="desc">常驻元数据保持精简，路由器每个阶段只加载一次，专业上下文按需读取。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6ee7b7"/></marker></defs>

  <style>
    .bg { fill:#0b1020; }
    .panel { fill:#141b31; stroke:#334166; stroke-width:1.5; }
    .soft { fill:#10172a; stroke:#293657; stroke-width:1.2; }
    .accent { fill:#6ee7b7; }
    .blue { fill:#7dd3fc; }
    .violet { fill:#c4b5fd; }
    .amber { fill:#fcd34d; }
    .white { fill:#f8fafc; }
    .muted { fill:#a8b2cc; }
    .label { font:700 17px Inter,ui-sans-serif,system-ui,sans-serif; letter-spacing:.2px; }
    .body { font:500 15px Inter,ui-sans-serif,system-ui,sans-serif; }
    .small { font:500 13px Inter,ui-sans-serif,system-ui,sans-serif; }
    .title { font:800 34px Inter,ui-sans-serif,system-ui,sans-serif; letter-spacing:-.5px; }
    .arrow { stroke:#6ee7b7; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
  </style>
  <rect class="bg" width="1200" height="720" rx="28"/>
  <text x="70" y="70" class="title white" text-anchor="start">只加载当前阶段需要的信息</text>
  <rect x="70" y="118" width="244" height="282" rx="18" fill="#142b3b" stroke="#4386aa" stroke-width="1.5"/>
  <text x="90" y="156" class="label blue" text-anchor="start">01</text>
  <text x="90" y="196" class="label white" text-anchor="start">始终可发现</text>
  <text x="90" y="254" class="body blue" text-anchor="start">简短元数据</text>
  <text x="90" y="326" class="small muted" text-anchor="start">只提供判断技能是否相关的信息</text>
  <path class="arrow" d="M317 259 H333"/>
  <rect x="340" y="118" width="244" height="282" rx="18" fill="#16342f" stroke="#3fa98a" stroke-width="1.5"/>
  <text x="360" y="156" class="label accent" text-anchor="start">02</text>
  <text x="360" y="196" class="label white" text-anchor="start">阶段边界</text>
  <text x="360" y="254" class="body accent" text-anchor="start">99行路由器 · 713词</text>
  <text x="360" y="326" class="small muted" text-anchor="start">读取一次，之后复用当前路径</text>
  <path class="arrow" d="M587 259 H603"/>
  <rect x="610" y="118" width="244" height="282" rx="18" fill="#2b2650" stroke="#7767ca" stroke-width="1.5"/>
  <text x="630" y="156" class="label violet" text-anchor="start">03</text>
  <text x="630" y="196" class="label white" text-anchor="start">需要专业能力时</text>
  <text x="630" y="254" class="body violet" text-anchor="start">一个主要专业技能</text>
  <text x="630" y="326" class="small muted" text-anchor="start">只有真实依赖才增加另一个</text>
  <path class="arrow" d="M857 259 H873"/>
  <rect x="880" y="118" width="244" height="282" rx="18" fill="#463719" stroke="#a77d2d" stroke-width="1.5"/>
  <text x="900" y="156" class="label amber" text-anchor="start">04</text>
  <text x="900" y="196" class="label white" text-anchor="start">完成或发布之前</text>
  <text x="900" y="254" class="body amber" text-anchor="start">先验证证据，再过独立发布门槛</text>
  <text x="900" y="326" class="small muted" text-anchor="start">验证与发布是两项不同判断</text>
  <rect class="panel" x="70" y="444" width="1060" height="82" rx="18"/>
  <text x="92" y="478" class="body white" text-anchor="start">只保存必须跨越对话的长期状态</text>
  <text x="92" y="510" class="body muted" text-anchor="start">日志只记录纠正 · 失败 · 发布</text>
  <text x="70" y="584" class="small muted" text-anchor="start">可选快捷方式</text>
  <rect class="soft" x="70" y="602" width="112" height="48" rx="13"/>
  <text x="126" y="632" class="body white" text-anchor="middle">quick</text>
  <rect class="soft" x="196" y="602" width="112" height="48" rx="13"/>
  <text x="252" y="632" class="body white" text-anchor="middle">build</text>
  <rect class="soft" x="322" y="602" width="112" height="48" rx="13"/>
  <text x="378" y="632" class="body white" text-anchor="middle">ship</text>
  <text x="1118" y="632" class="small muted" text-anchor="end">metadata → router → specialist → evidence</text>
</svg>
